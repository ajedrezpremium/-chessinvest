# Mantener la instancia de Render despierta.
# Importante: un self-ping interno (localhost) NO evita el spin-down de Render,
# porque solo el tráfico que entra por el proxy externo cuenta. Este workflow
# pega contra la URL pública desde GitHub Actions (repo público = gratis).
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://chessinvest.onrender.com/api/status)
          echo "HTTP $code"
          test "$code" = "200"
